<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 326">
<title id="title">Overtime is associated with a higher attrition rate</title>
<desc id="desc">Employees working overtime vs. employees not working overtime</desc>
<rect width="100%" height="100%" fill="#F7F8F5"/>
<text x="42" y="52" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#173D3A">Overtime is associated with a higher attrition rate</text>
<text x="42" y="84" font-family="Arial, sans-serif" font-size="14" fill="#5B6B69">Employees working overtime vs. employees not working overtime</text>
<text x="42" y="161" font-family="Arial, sans-serif" font-size="15" fill="#263A38">Overtime: Yes (127/416)</text>
<rect x="255" y="138" width="500" height="24" rx="5" fill="#E3E9E5"/>
<rect x="255" y="138" width="500.0" height="24" rx="5" fill="#9A6B1F"/>
<text x="769" y="156" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#173D3A">30.5%</text>
<text x="922" y="156" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#5B6B69">416</text>
<text x="42" y="215" font-family="Arial, sans-serif" font-size="15" fill="#263A38">Overtime: No (110/1054)</text>
<rect x="255" y="192" width="500" height="24" rx="5" fill="#E3E9E5"/>
<rect x="255" y="192" width="171.0" height="24" rx="5" fill="#9A6B1F"/>
<text x="769" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#173D3A">10.4%</text>
<text x="922" y="210" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#5B6B69">1054</text>
<text x="42" y="286" font-family="Arial, sans-serif" font-size="12" fill="#5B6B69">Descriptive difference in this synthetic dataset; not evidence of causation.</text>
</svg>